<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worship Editor - Estilo Haz Llover</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-app: #121212; --panel-bg: #1e1e1e; --text-color: #f0f0f0;
            --s-sep: #ff79c6; --s-str: #f1fa8c; --s-sla: #8be9fd;
            --c-header: #083D56; --c-green: #0E4421; --c-purple: #46184A; 
            --c-brown: #783f14; --c-red: #8b1818; --c-blue: #154c79;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0; font-family: 'Roboto', sans-serif;
            background-color: var(--bg-app); color: var(--text-color);
            /* Usamos dvh para móviles para evitar problemas con la barra de navegación */
            height: 100dvh; 
            overflow: hidden;
            overscroll-behavior: none; /* Evita el rebote de la página en Mac/iOS */
        }

        .main-container { 
            display: flex; 
            width: 100%; 
            height: 100%; 
        }

        /* --- EDITOR PANE --- */
        .editor-pane {
            width: 400px; 
            background-color: var(--panel-bg);
            border-right: 1px solid #444;
            display: flex; 
            flex-direction: column; 
            z-index: 10;
        }

        .editor-header {
            padding: 10px; background: #252525; border-bottom: 1px solid #333;
            display: flex; gap: 10px; flex-shrink: 0;
        }
        .editor-header input {
            background: #333; border: 1px solid #444; color: white;
            padding: 8px; border-radius: 4px; font-size: 16px; /* 16px evita zoom en iOS al hacer focus */
            height: 40px;
        }
        #inTitle { flex: 1; min-width: 0; } 
        #inKey { width: 60px; flex: none; text-align: center; font-weight: bold; }

        /* --- CODE EDITOR (CORE FIXES HERE) --- */
        .code-wrapper { 
            position: relative; 
            flex: 1; /* Ocupa todo el espacio restante verticalmente */
            background-color: #1e1e1e; 
            overflow: hidden; /* El contenedor no scrollea, los hijos sí */
            min-height: 0; /* Crucial para Firefox/Flexbox */
        }

        .mono-layer {
            font-family: Consolas, "Courier New", monospace; 
            font-size: 16px; line-height: 24px; letter-spacing: 0px; font-weight: normal;
            position: absolute; 
            inset: 0; /* Top, Right, Bottom, Left = 0. Fuerza a llenar el contenedor */
            width: 100%; height: 100%;
            margin: 0; border: 0; padding: 15px; 
            white-space: pre; word-wrap: normal;
        }

        /* Capa de renderizado de colores (detrás) */
        .code-highlight { 
            z-index: 1; 
            color: #ccc; 
            pointer-events: none; 
            background-color: #1e1e1e;
            overflow: hidden; /* Solo el textarea hace scroll, este le sigue por JS */
        }

        /* Capa de escritura (invisible pero interactiva) */
        .code-editor { 
            z-index: 2; 
            color: transparent; 
            background: transparent; 
            caret-color: #fff; 
            resize: none; 
            overflow: auto; /* Este es el que recibe el dedo/mouse */
            -webkit-overflow-scrolling: touch; /* Suavidad en iOS */
        }
        
        .hlSep { color: var(--s-sep); font-weight: bold; }
        .hlStr { color: var(--s-str); font-weight: bold; }
        .hlSla { color: var(--s-sla); }

        /* --- PREVIEW PANE --- */
        .preview-pane {
            flex: 1; background-color: #121212;
            overflow: auto; display: flex; padding: 20px; position: relative;
            -webkit-overflow-scrolling: touch;
        }

        .scalable-wrapper {
            transform-origin: top left; transition: transform 0.1s ease-out;
            margin: auto; flex-shrink: 0; 
        }

        .chart-container {
            width: 720px; 
            background: transparent; 
            display: inline-block; 
            /* Padding extra para que al exportar no salga cortado el borde de la sombra */
            padding: 10px; 
        }

        /* --- HEADER AL ESTILO "HAZ LLOVER" --- */
        .header-bar {
            background-color: var(--c-header); 
            min-height: 60px;
            display: flex; align-items: stretch;
            border: 1px solid #444; /* Borde sutil en lugar de sombra */
            /* box-shadow REMOVIDO */
            width: 100%; 
            position: relative;
            z-index: 2; 
        }
        
        .header-title-box {
            flex: 1; 
            display: flex; align-items: center;
            padding: 0 15px;
            overflow: hidden;
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        .header-title {
            font-size: 20px; font-weight: 900; color: white;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
        }

        .key-card-wrapper {
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2); 
        }
        
        .key-text { font-size: 28px; font-weight: 900; color: white; }
        
        /* --- TABLA --- */
        .chart-table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            table-layout: fixed; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .chart-table td { 
            border: 1px solid #555; 
            color: white; vertical-align: middle; padding: 0; 
        }
        .td-transparent { border: none !important; background: transparent !important; }
        
        .lyrics-cell { height: 100%; }
        .lyrics-inner {
            display: flex; align-items: center; justify-content: center;
            padding: 8px 12px; text-align: center; font-size: 16px; font-weight: 500;
            white-space: pre-wrap; line-height: 1.3;
        }
        .chord-cell { height: 50px; }
        .chord-inner {
            display: flex; justify-content: center; align-items: center;
            height: 100%; width: 100%; font-size: 20px; font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }
        .split-box { display: flex; flex-direction: column; height: 100%; }
        .split-top, .split-bottom {
            flex: 1; display: flex; justify-content: center; align-items: center;
            font-size: 18px; font-weight: 700;
        }
        .split-top { border-bottom: 1px solid #555; }
        
        /* Colores Sólidos */
        .bg-green { background-color: var(--c-green); } .bg-purple { background-color: var(--c-purple); }
        .bg-brown { background-color: var(--c-brown); } .bg-red { background-color: var(--c-red); }
        .bg-blue { background-color: var(--c-blue); }

        /* Controles */
        .floating-controls {
            position: fixed; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
        }
        .ctrl-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(4px);
            font-size: 18px; font-weight: bold; user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent; /* Quita el cuadro azul al tocar en Android */
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
        .btn-fullscreen { background: var(--c-blue); border: none; }
        .btn-export { background: var(--c-green); border: none; } /* Botón de exportar */

        /* --- MOBILE MEDIA QUERY OPTIMIZED --- */
        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; }
            
            .editor-pane { 
                width: 100%; 
                /* En móvil, el editor ocupa el 60% para que el teclado no tape todo */
                flex: 0 0 60%; 
                border-top: 2px solid #333; 
                border-right: none;
            }
            
            .preview-pane { 
                /* La vista previa ocupa el 40% superior */
                flex: 0 0 40%; 
                padding: 10px; 
                border-bottom: 1px solid #333;
            }

            .floating-controls { top: 10px; right: 10px; gap: 5px; }
            .ctrl-btn { width: 35px; height: 35px; font-size: 16px; }
            
            /* Ajuste de fuente para evitar zoom en iOS */
            .mono-layer { font-size: 14px; padding: 10px; }
        }

        /* Pantalla completa */
        :fullscreen .preview-pane { padding: 0; background: black; width: 100%; height: 100%; }
        :fullscreen .floating-controls { display: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="editor-pane">
            <div class="editor-header">
                <input type="text" id="inTitle" value="Dame de Beber - Marco Barrientos" placeholder="Título">
                <input type="text" id="inKey" value="D" placeholder="Tono">
            </div>
            
            <div class="code-wrapper">
                <pre id="highlighting" class="code-highlight mono-layer" aria-hidden="true"><code id="highlighting-content"></code></pre>
                <textarea id="inCode" class="code-editor mono-layer" spellcheck="false" placeholder="Escribe aquí tu tabla...">
Quiero estar en tu presencia
G/E | G/D ; Asus4|A ; D > A/C# ; D/B | D/A
G/E | G/D ; Asus4|A ; D ; D | D/B , C/D - D/F# ; EXTRA

Dame de beber
G ; A/G ; A/F# ; D/B | D/A
G/E | G/D ; Asus4|A ; D ; C/D - D/F#, D | D/B ; EXTRA
G ; A/G ; A/F# ; D/B | D/A</textarea>
            </div>
        </div>

        <div class="preview-pane" id="previewPane">
            <div class="floating-controls">
                <div class="ctrl-btn btn-export" onclick="exportToPng()" title="Exportar PNG">⬇</div>
                <div class="ctrl-btn btn-fullscreen" onclick="toggleFullScreen()">⛶</div>
                <div class="ctrl-btn" onclick="adjustZoom(0.05)">+</div>
                <div class="ctrl-btn" onclick="adjustZoom(-0.05)">-</div>
                <div class="ctrl-btn" onclick="resetZoom()" style="font-size:12px">1:1</div>
            </div>

            <div class="scalable-wrapper" id="scalableWrapper">
                <div class="chart-container" id="chartContainer">
                    <div class="header-bar" id="headerBar">
                        <div class="header-title-box">
                            <div class="header-title" id="outTitle">Título</div>
                        </div>
                        <div class="key-card-wrapper" id="keyWrapper">
                            <div class="key-text" id="outKey">C</div>
                        </div>
                    </div>
                    <table class="chart-table">
                        <colgroup id="tableColGroup"></colgroup>
                        <tbody id="chartBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inCode = document.getElementById('inCode');
        const highlightingContent = document.getElementById('highlighting-content');
        const highlighting = document.getElementById('highlighting');
        const inTitle = document.getElementById('inTitle');
        const inKey = document.getElementById('inKey');
        const outTitle = document.getElementById('outTitle');
        const outKey = document.getElementById('outKey');
        const chartBody = document.getElementById('chartBody');
        const tableColGroup = document.getElementById('tableColGroup');
        const chartContainer = document.getElementById('chartContainer');
        const headerBar = document.getElementById('headerBar');
        const keyWrapper = document.getElementById('keyWrapper');
        const scalableWrapper = document.getElementById('scalableWrapper');
        const previewPane = document.getElementById('previewPane');

        const colorCycle = ['bg-green', 'bg-purple', 'bg-green', 'bg-purple', 'bg-brown', 'bg-red'];

        // --- ZOOM ---
        let currentScale = 0.8;

        function applyZoom() {
            scalableWrapper.style.transform = `scale(${currentScale})`;
            const baseWidth = 720; 
            const baseHeight = chartContainer.offsetHeight;
            // Ajustamos el wrapper para que ocupe el espacio real después de escalar
            scalableWrapper.style.width = `${baseWidth * currentScale}px`;
            scalableWrapper.style.height = `${baseHeight * currentScale}px`;
        }

        function adjustZoom(delta) {
            currentScale += delta;
            if (currentScale < 0.2) currentScale = 0.2;
            if (currentScale > 3.0) currentScale = 3.0;
            applyZoom();
        }

        function resetZoom() {
            // Detección mejorada de móvil para zoom inicial
            const isSmallScreen = window.innerWidth < 768;
            if (isSmallScreen) {
                // Calcular un zoom que encaje el ancho de 720px en la pantalla del móvil
                const availableWidth = window.innerWidth - 40; // 20px padding
                currentScale = availableWidth / 720;
            } else {
                currentScale = 1.0;
            }
            applyZoom();
        }

        // --- EXPORTAR PNG ---
        function exportToPng() {
            // Seleccionamos el contenedor
            const element = document.getElementById('chartContainer');
            
            // Usamos html2canvas
            html2canvas(element, {
                scale: 3, // Calidad 3x para que se vea muy nítido
                backgroundColor: '#121212', // Forzamos el fondo oscuro
                useCORS: true,
                logging: false
            }).then(canvas => {
                // Crear un enlace temporal para la descarga
                const link = document.createElement('a');
                // Nombre del archivo basado en el título
                const filename = (inTitle.value || 'partitura').replace(/[^a-z0-9]/gi, '_').toLowerCase();
                link.download = `${filename}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Error al exportar:", err);
                alert("Hubo un error al generar la imagen.");
            });
        }

        // --- RENDER ---
        function updateHighlighting() {
            let text = inCode.value;
            // Escapar HTML para seguridad y visualización correcta
            text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            // Colorear sintaxis
            text = text.replace(/(&gt;|[|;\/\-])/g, function(match) {
                if (match === '&gt;' || match === '-') return '<span class="hlStr">' + match + '</span>';
                if (match === '/') return '<span class="hlSla">' + match + '</span>';
                return '<span class="hlSep">' + match + '</span>';
            });
            // Importante: agregar un espacio al final si termina en salto de línea para que el scroll coincida
            if (text.endsWith('\n')) text += '&nbsp;';
            highlightingContent.innerHTML = text;
        }

        function syncScroll() {
            // El textarea controla el scroll del highlighting
            highlighting.scrollTop = inCode.scrollTop;
            highlighting.scrollLeft = inCode.scrollLeft;
        }

        function render() {
            outTitle.textContent = inTitle.value;
            outKey.textContent = inKey.value;
            updateHighlighting();

            const text = inCode.value;
            const lines = text.split('\n');
            let sections = [];
            let currentSection = { lyrics: '', rows: [] };
            let maxCols = 0;

            lines.forEach(line => {
                const clean = line.trim();
                if(!clean) return;
                // Si la línea tiene separadores de acordes, es una fila de acordes
                if(clean.includes(';') || clean.includes('|')) {
                    const cols = clean.split(';');
                    if(cols.length > maxCols) maxCols = cols.length;
                    currentSection.rows.push(clean);
                } else {
                    // Si ya había filas de acordes acumuladas, cerramos la sección anterior
                    if(currentSection.rows.length > 0) {
                        sections.push(currentSection);
                        currentSection = { lyrics: '', rows: [] };
                    }
                    currentSection.lyrics += (currentSection.lyrics ? '\n' : '') + clean;
                }
            });
            // Empujar la última sección si existe
            if(currentSection.rows.length > 0 || currentSection.lyrics) sections.push(currentSection);

            // Mínimo 4 columnas para estética
            if (maxCols < 4) maxCols = 4; 
            
            // --- CÁLCULO DE ANCHOS ---
            const lyricsPercent = 28; 
            const chordAreaPercent = 100 - lyricsPercent; 
            const singleChordPercent = chordAreaPercent / maxCols; 

            // Definimos ColGroup HTML
            let colHtml = `<col style="width: ${lyricsPercent}%">`; 
            for(let i=0; i<maxCols; i++) colHtml += `<col>`;
            tableColGroup.innerHTML = colHtml;

            // Header recortado
            const chordsToCover = Math.min(maxCols, 4); 
            const headerTotalWidthPercent = lyricsPercent + (singleChordPercent * chordsToCover);
            headerBar.style.width = `${headerTotalWidthPercent}%`;

            // Key Wrapper relativo
            const keyWidthRelative = (singleChordPercent / headerTotalWidthPercent) * 100;
            keyWrapper.style.width = `${keyWidthRelative}%`;

            let html = '';
            let colorIdx = 0;
            
            sections.forEach(sect => {
                if(sect.rows.length === 0) return;
                const currColor = colorCycle[colorIdx % colorCycle.length];
                const nextColor = colorCycle[(colorIdx + 1) % colorCycle.length];
                const rowSpan = sect.rows.length;

                sect.rows.forEach((rowStr, rIdx) => {
                    html += `<tr>`;
                    if(rIdx === 0) {
                        html += `<td class="lyrics-cell ${currColor}" rowspan="${rowSpan}">
                                    <div class="lyrics-inner">${sect.lyrics}</div>
                                 </td>`;
                    }
                    const cells = rowStr.split(';');
                    cells.forEach(cell => {
                        cell = cell.trim();
                        // Detección de celda dividida con coma
                        if(cell.includes(',')) {
                            const p = cell.split(',');
                            html += `<td class="chord-cell" style="padding:0;">
                                            <div class="split-box">
                                                <div class="split-top ${currColor}">${p[0].trim()}</div>
                                                <div class="split-bottom ${nextColor}">${p[1] ? p[1].trim() : ''}</div>
                                            </div>
                                     </td>`;
                        } else {
                            html += `<td class="chord-cell ${currColor}">
                                            <div class="chord-inner">${cell}</div>
                                     </td>`;
                        }
                    });
                    // Rellenar celdas vacías transparentes
                    const missing = maxCols - cells.length;
                    for(let i=0; i<missing; i++) html += `<td class="chord-cell td-transparent">&nbsp;</td>`;
                    html += `</tr>`;
                });
                colorIdx++;
            });
            chartBody.innerHTML = html;

            // Pequeño delay para asegurar que el DOM se pintó antes de calcular el alto
            setTimeout(applyZoom, 0); 
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (previewPane.requestFullscreen) previewPane.requestFullscreen();
                else if (previewPane.webkitRequestFullscreen) previewPane.webkitRequestFullscreen();
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(e=>{});
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Event Listeners
        inCode.addEventListener('input', render);
        inCode.addEventListener('scroll', syncScroll);
        inTitle.addEventListener('input', render);
        inKey.addEventListener('input', render);
        
        // Inicialización
        window.addEventListener('load', () => {
            resetZoom();
            render();
            // Forzar un repintado del scroll
            setTimeout(() => {
                inCode.scrollTop = 1; 
                inCode.scrollTop = 0; 
            }, 100);
        });
        
        window.addEventListener('resize', () => {
            // Solo ajustar zoom si no estamos editando activamente (para evitar saltos con el teclado)
            if(document.activeElement !== inCode) {
               // Opcional: resetZoom(); 
            }
        });
    </script>
</body>
</html>
