<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tabla de Acordes — Iglesia YHWH</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- html2canvas para exportar PNG localmente -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            /* Paleta Slate/Zinc (True Black OLED) */
            --bg-app: #000000; 
            --panel-bg: #09090b; 
            --panel-header: #09090b;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #3f3f46; 
            --accent-carmesi: #f43f5e; 
            --accent-celeste: #60a5fa; 
            --shadow: none;

            /* Colores de sección neón sutiles */
            --c-header: #000000; 
            
            /* Tamaño de fuente UNIFORME para TODOS los acordes */
            --chord-fs-full: 14px;
            --chord-fs-half: 14px;
            --chord-fs-quarter: 14px;

            /* Altura de filas de control (agregar/eliminar) */
            --ctrl-row-height: 30px;

            /* Estrofa (Verde Neón) */
            --color-estrofa-border: #10b981;
            --color-estrofa-chord: #34d399;
            
            /* Coro (Celeste Neón) */
            --color-coro-border: #60a5fa;
            --color-coro-chord: #93c5fd;
            
            /* Puente (Fucsia Neón) */
            --color-puente-border: #d946ef;
            --color-puente-chord: #f472b6;
            
            /* Pre-Coro (Naranja Neón) */
            --color-precoro-border: #f97316;
            --color-precoro-chord: #fb923c;
            
            /* Intro / Outro / Solo (Azul Eléctrico) */
            --color-intro-border: #3b82f6;
            --color-intro-chord: #60a5fa;

            /* General */
            --color-general-border: #4b5563;
            --color-general-chord: #e5e7eb;
        }

        /* --- TEMA CLARO DE ALTO CONTRASTE --- */
        body.theme-light {
            --bg-app: #f9fafb;
            --panel-bg: #ffffff;
            --panel-header: #f3f4f6;
            --text-color: #111827;
            --text-secondary: #6b7280;
            --border-color: #c4c8d0; 
            --accent-carmesi: #be123c;
            --accent-celeste: #3b82f6;
            --shadow: none;

            --c-header: #f3f4f6;

            /* Colores de sección para sol directo */
            --color-estrofa-border: #059669;
            --color-estrofa-chord: #064e3b; 

            --color-coro-border: #2563eb;
            --color-coro-chord: #1e3a8a; 

            --color-puente-border: #c026d3;
            --color-puente-chord: #701a75; 

            --color-precoro-border: #ea580c;
            --color-precoro-chord: #7c2d12; 

            --color-intro-border: #1d4ed8;
            --color-intro-chord: #0f172a; 

            --color-general-border: #4b5563;
            --color-general-chord: #111827;
        }

        /* --- PALETA DE FONDOS DE SECCIÓN (auto-asignada cíclicamente) --- */
        /* Modo Oscuro */
        .sect-bg-0 { background-color: #0e1e30 !important; }
        .sect-bg-1 { background-color: #0d2119 !important; }
        .sect-bg-2 { background-color: #1b1132 !important; }
        .sect-bg-3 { background-color: #221a0c !important; }
        .sect-bg-4 { background-color: #0d2028 !important; }
        .sect-bg-5 { background-color: #25101d !important; }
        /* Modo Claro */
        .theme-light .sect-bg-0 { background-color: #e3ecf8 !important; }
        .theme-light .sect-bg-1 { background-color: #dff5ea !important; }
        .theme-light .sect-bg-2 { background-color: #ede3f8 !important; }
        .theme-light .sect-bg-3 { background-color: #f7eddf !important; }
        .theme-light .sect-bg-4 { background-color: #dff0f6 !important; }
        .theme-light .sect-bg-5 { background-color: #f6dfec !important; }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-app); 
            color: var(--text-color);
            height: 100dvh; 
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s;
        }

        /* --- APP NAVBAR --- */
        .app-navbar {
            background-color: var(--panel-header);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 100;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-logo {
            height: 32px;
            width: auto;
        }

        .navbar-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, var(--accent-celeste), var(--text-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-actions {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .theme-light .nav-btn {
            background: rgba(0,0,0,0.02);
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .theme-light .nav-btn:hover {
            background: rgba(0,0,0,0.05);
        }

        .nav-btn.primary {
            background: var(--accent-celeste);
            border-color: transparent;
            color: #000000 !important;
            font-weight: 700;
        }
        
        .theme-light .nav-btn.primary {
            color: #ffffff !important;
        }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
            padding: 20px 10px;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        .chart-wrapper {
            margin: 0 auto 80px auto;
            transform-origin: top center;
            transition: transform 0.2s ease-out;
        }

        .chart-container {
            width: 720px; 
            background: transparent; 
            padding: 10px 0;
            position: relative;
        }

        /* Cabecera como fila de tabla (alineada con columnas de contenido) */
        .header-title-td {
            height: 56px;
            background-color: var(--c-header) !important;
            padding: 0 20px !important;
            cursor: pointer;
            transition: background 0.2s;
            vertical-align: middle;
        }
        .header-title-td:hover {
            background: rgba(255,255,255,0.02) !important;
        }
        .theme-light .header-title-td {
            background-color: #f3f4f6 !important;
        }
        .theme-light .header-title-td:hover {
            background: rgba(0,0,0,0.02) !important;
        }
        .header-title {
            font-size: 18px;
            font-weight: 850;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 56px;
        }
        .header-key-td {
            height: 56px;
            background-color: rgba(255,255,255,0.02) !important;
            cursor: pointer;
            text-align: center;
            vertical-align: middle;
            transition: background 0.2s;
        }
        .header-key-td:hover {
            background: rgba(255,255,255,0.06) !important;
        }
        .theme-light .header-key-td {
            background-color: rgba(0,0,0,0.01) !important;
        }
        .theme-light .header-key-td:hover {
            background: rgba(0,0,0,0.04) !important;
        }
        .key-text {
            font-size: 22px;
            font-weight: 850;
            color: var(--accent-celeste);
        }

        /* --- TABLA ESTRUCTURAL MINIMALISTA --- */
        .chart-table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            table-layout: fixed; 
            box-shadow: var(--shadow); 
        }

        .chart-table td { 
            border: 1px solid var(--border-color); 
            background-color: #000000; 
            vertical-align: middle; 
            padding: 0; 
            position: relative;
        }

        .theme-light .chart-table td {
            background-color: #ffffff;
            border-color: var(--border-color);
        }

        .td-transparent { border: none !important; background: transparent !important; }

        /* Celda de letra interactiva con barra indicadora vertical de color */
        .lyrics-cell { 
            cursor: pointer;
            transition: all 0.2s;
            background-color: #09090b; 
        }
        .lyrics-cell:hover {
            filter: brightness(1.3);
        }
        
        .theme-light .lyrics-cell {
            background-color: #f3f4f6;
        }
        .theme-light .lyrics-cell:hover {
            filter: brightness(0.96);
        }

        .lyrics-cell.selected {
            outline: 2px solid var(--accent-celeste);
            outline-offset: -2px;
        }
        .lyrics-inner {
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 14px 16px; 
            text-align: center; 
            font-size: 14px; 
            font-weight: 700;
            color: var(--text-color);
            white-space: pre-wrap; 
            line-height: 1.4;
            border-left: 5px solid var(--color-general-border);
            height: 100%;
            width: 100%;
        }
        
        .theme-light .lyrics-inner {
            color: #000000;
            font-weight: 800;
        }

        /* Colores de indicadores de sección */
        .lyrics-cell.sect-estrofa .lyrics-inner { border-left-color: var(--color-estrofa-border); }
        .lyrics-cell.sect-coro .lyrics-inner { border-left-color: var(--color-coro-border); }
        .lyrics-cell.sect-puente .lyrics-inner { border-left-color: var(--color-puente-border); }
        .lyrics-cell.sect-pre-coro .lyrics-inner { border-left-color: var(--color-precoro-border); }
        .lyrics-cell.sect-intro .lyrics-inner { border-left-color: var(--color-intro-border); }
        .lyrics-cell.sect-outro .lyrics-inner { border-left-color: var(--color-intro-border); }
        .lyrics-cell.sect-solo .lyrics-inner { border-left-color: var(--color-intro-border); }

        /* Celda de acordes interactiva — padding: 0 para bordes flush */
        .chord-cell { 
            height: 56px; 
            cursor: pointer;
            transition: all 0.2s;
            padding: 0 !important; 
        }
        .chord-cell:hover {
            filter: brightness(1.2);
        }
        .theme-light .chord-cell:hover {
            filter: brightness(0.96);
        }

        .chord-cell.selected {
            outline: 3px solid var(--accent-celeste);
            outline-offset: -3px;
            box-shadow: inset 0 0 12px rgba(96, 165, 250, 0.25);
            background-color: rgba(96, 165, 250, 0.04);
        }

        /* --- ALTERNANCIA VISUAL POR COMPÁS (columna oscura/clara) --- */
        .chord-cell.col-dark::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }
        .theme-light .chord-cell.col-dark::after {
            background: rgba(0, 0, 0, 0.05);
        }
        /* Texto por encima del overlay de alternancia */
        .chord-inner, .split-box, .split-horizontal-box {
            position: relative;
            z-index: 1;
        }
        
        /* --- TIPOGRAFÍA INTER PARA ACORDES: limpia, precisa, altamente legible --- */
        .chord-inner, .split-left, .split-right, .split-top, .split-bottom {
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .chord-inner {
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100%; 
            width: 100%; 
            color: var(--color-general-chord);
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
            padding: 0 4px;
        }

        .theme-light .chord-inner {
            text-shadow: none;
        }

        /* Colores de acordes según la sección */
        .sect-estrofa .chord-inner { color: var(--color-estrofa-chord); }
        .sect-coro .chord-inner { color: var(--color-coro-chord); }
        .sect-puente .chord-inner { color: var(--color-puente-chord); }
        .sect-pre-coro .chord-inner { color: var(--color-precoro-chord); }
        .sect-intro .chord-inner { color: var(--color-intro-chord); }
        .sect-outro .chord-inner { color: var(--color-intro-chord); }
        .sect-solo .chord-inner { color: var(--color-intro-chord); }

        /* Celdas divididas Verticalmente (vueltas/comas) — 50% rígido, sin padding */
        .split-box { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            width: 100%; 
        }
        .split-top, .split-bottom {
            flex: 0 0 50%;
            height: 50%;
            max-height: 50%;
            display: flex; 
            justify-content: center; 
            align-items: center;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            color: var(--color-general-chord);
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            padding: 0;
        }
        
        .split-top > .chord-inner, .split-bottom > .chord-inner {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 3px;
        }

        .split-top { border-bottom: 1px solid var(--border-color); }
        .theme-light .split-top, .theme-light .split-bottom { text-shadow: none; }

        .sect-estrofa .split-top, .sect-estrofa .split-bottom { color: var(--color-estrofa-chord); }
        .sect-coro .split-top, .sect-coro .split-bottom { color: var(--color-coro-chord); }
        .sect-puente .split-top, .sect-puente .split-bottom { color: var(--color-puente-chord); }
        .sect-pre-coro .split-top, .sect-pre-coro .split-bottom { color: var(--color-precoro-chord); }
        .sect-intro .split-top, .sect-intro .split-bottom { color: var(--color-intro-chord); }
        .sect-outro .split-top, .sect-outro .split-bottom { color: var(--color-intro-chord); }
        .sect-solo .split-top, .sect-solo .split-bottom { color: var(--color-intro-chord); }

        /* --- CELDAS DIVIDIDAS HORIZONTALMENTE (Tiempos laterales |) — 50% rígido, sin padding --- */
        .split-horizontal-box {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .split-left, .split-right {
            flex: 0 0 50%;
            width: 50%;
            max-width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            color: var(--color-general-chord);
            height: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
            padding: 0 3px;
        }
        
        .split-left {
            border-right: 1px solid var(--border-color);
        }
        .theme-light .split-left, .theme-light .split-right {
            text-shadow: none;
        }

        .sect-estrofa .split-left, .sect-estrofa .split-right { color: var(--color-estrofa-chord); }
        .sect-coro .split-left, .sect-coro .split-right { color: var(--color-coro-chord); }
        .sect-puente .split-left, .sect-puente .split-right { color: var(--color-puente-chord); }
        .sect-pre-coro .split-left, .sect-pre-coro .split-right { color: var(--color-precoro-chord); }
        .sect-intro .split-left, .sect-intro .split-right { color: var(--color-intro-chord); }
        .sect-outro .split-left, .sect-outro .split-right { color: var(--color-intro-chord); }
        .sect-solo .split-left, .sect-solo .split-right { color: var(--color-intro-chord); }

        /* Forzar simetría en el flex de cajas mixtas 2x2 */
        .split-top .split-horizontal-box, .split-bottom .split-horizontal-box {
            width: 100%;
            height: 100%;
        }

        /* --- CONTROLES DE ESTRUCTURA INTEGRADOS EN LA TABLA --- */
        
        /* Fila de Añadir Fila (Abajo) */
        .add-row-cell {
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.01) !important;
            border: 1px dashed var(--border-color) !important;
            transition: all 0.2s;
            height: var(--ctrl-row-height);
            text-align: center;
            vertical-align: middle;
        }
        .theme-light .add-row-cell {
            background-color: rgba(0, 0, 0, 0.01) !important;
            border-color: var(--border-color) !important;
        }
        .add-row-cell:hover {
            background-color: rgba(96, 165, 250, 0.06) !important;
            border-color: var(--accent-celeste) !important;
        }
        .add-row-inner {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 100%;
        }
        .theme-light .add-row-inner {
            color: #111827;
        }
        .add-row-cell:hover .add-row-inner {
            color: var(--accent-celeste);
        }

        /* Botón de Agregar Sección (Abajo y arriba) */
        .add-section-cell {
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.01) !important;
            border: 1px dashed var(--border-color) !important;
            transition: all 0.2s;
            text-align: center;
            vertical-align: middle;
            height: var(--ctrl-row-height);
        }
        .theme-light .add-section-cell {
            background-color: rgba(0, 0, 0, 0.01) !important;
            border-color: var(--border-color) !important;
        }
        .add-section-cell:hover {
            background-color: rgba(96, 165, 250, 0.06) !important;
            border-color: var(--accent-celeste) !important;
        }
        .add-section-inner {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .theme-light .add-section-inner {
            color: #111827;
        }
        .add-section-cell:hover .add-section-inner {
            color: var(--accent-celeste);
        }

        /* Botón de agregar sección inicial en la fila de control superior */
        .col-control-tr .add-section-cell {
            height: var(--ctrl-row-height) !important;
        }

        /* Celda de Agregar Columna (Compás) (Derecha) */
        .add-col-cell {
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.01) !important;
            border: 1px dashed var(--border-color) !important;
            transition: all 0.2s;
            width: 44px !important;
            vertical-align: middle;
            text-align: center;
        }
        .theme-light .add-col-cell {
            background-color: rgba(0, 0, 0, 0.01) !important;
            border-color: var(--border-color) !important;
        }
        .add-col-cell:hover {
            background-color: rgba(96, 165, 250, 0.06) !important;
            border-color: var(--accent-celeste) !important;
        }
        .add-col-inner {
            font-size: 18px;
            font-weight: 850;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }
        .add-col-cell:hover .add-col-inner {
            color: var(--accent-celeste);
        }

        /* --- BOTONES DE ELIMINACIÓN DE ESTRUCTURA CUADRADOS DE COMPORTAMIENTO HOVER SIMÉTRICO --- */
        
        /* Eliminar Columna (Arriba) */
        .col-control-tr td {
            height: var(--ctrl-row-height); 
            vertical-align: middle;
            text-align: center;
            padding: 0 !important;
        }
        .col-control-tr td.td-transparent {
            border: none !important;
            background: transparent !important;
        }
        .col-delete-cell {
            cursor: pointer;
            background-color: rgba(244, 63, 94, 0.01) !important;
            border: 1px dashed rgba(244, 63, 94, 0.25) !important;
            transition: all 0.2s;
        }
        .theme-light .col-delete-cell {
            background-color: rgba(190, 18, 60, 0.01) !important;
            border-color: rgba(190, 18, 60, 0.25) !important;
        }
        .col-delete-cell:hover {
            background-color: rgba(244, 63, 94, 0.08) !important;
            border-color: var(--accent-carmesi) !important;
        }
        .theme-light .col-delete-cell:hover {
            background-color: rgba(190, 18, 60, 0.06) !important;
            border-color: var(--accent-carmesi) !important;
        }
        .col-delete-inner {
            font-size: 11px;
            font-weight: 800;
            color: rgba(244, 63, 94, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            transition: color 0.2s;
        }
        .theme-light .col-delete-inner {
            color: rgba(190, 18, 60, 0.7);
        }
        .col-delete-cell:hover .col-delete-inner {
            color: var(--accent-carmesi); 
        }

        /* Eliminar Fila (Izquierda) */
        .row-delete-cell {
            cursor: pointer;
            background-color: rgba(244, 63, 94, 0.01) !important;
            border: 1px dashed rgba(244, 63, 94, 0.25) !important;
            transition: all 0.2s;
            width: 44px !important;
            height: 56px;
            text-align: center;
            vertical-align: middle;
        }
        .theme-light .row-delete-cell {
            background-color: rgba(190, 18, 60, 0.01) !important;
            border-color: rgba(190, 18, 60, 0.25) !important;
        }
        .row-delete-cell:hover {
            background-color: rgba(244, 63, 94, 0.08) !important;
            border-color: var(--accent-carmesi) !important;
        }
        .theme-light .row-delete-cell:hover {
            background-color: rgba(190, 18, 60, 0.06) !important;

        // --- ALGORITMO PARSER Y SERIALIZADOR DE CELDAS INTERACTIVOS ---

        function parseCellToStructure(text) {
            text = text.trim().replace(/\s*-\s*/g, ' | '); 
            if (text === 'VACÍO' || text === '') text = '';
            
            let struct = {
                hasComma: false,
                top: { hasPipe: false, left: '', right: '', center: '' },
                bottom: { hasPipe: false, left: '', right: '', center: '' },
                single: { hasPipe: false, left: '', right: '', center: '' }
            };

            if (text.includes(',')) {
                struct.hasComma = true;
                const parts = text.split(',');
                const topText = parts[0].trim();
                const bottomText = parts[1] ? parts[1].trim() : '';

                if (topText.includes('|')) {
                    struct.top.hasPipe = true;
                    const topParts = topText.split('|');
                    struct.top.left = topParts[0].trim();
                    struct.top.right = topParts[1] ? topParts[1].trim() : '';
                } else {
                    struct.top.hasPipe = false;
                    struct.top.center = topText;
                }

                if (bottomText.includes('|')) {
                    struct.bottom.hasPipe = true;
                    const bottomParts = bottomText.split('|');
                    struct.bottom.left = bottomParts[0].trim();
                    struct.bottom.right = bottomParts[1] ? bottomParts[1].trim() : '';
                } else {
                    struct.bottom.hasPipe = false;
                    struct.bottom.center = bottomText;
                }
            } else {
                struct.hasComma = false;
                if (text.includes('|')) {
                    struct.single.hasPipe = true;
                    const parts = text.split('|');
                    struct.single.left = parts[0].trim();
                    struct.single.right = parts[1] ? parts[1].trim() : '';
                } else {
                    struct.single.hasPipe = false;
                    struct.single.center = text;
                }
            }
            return struct;
        }

        function serializeStructureToCell(struct) {
            if (struct.hasComma) {
                let topText = '';
                if (struct.top.hasPipe) {
                    topText = `${struct.top.left || 'VACÍO'} | ${struct.top.right || 'VACÍO'}`;
                } else {
                    topText = struct.top.center || 'VACÍO';
                }

                let bottomText = '';
                if (struct.bottom.hasPipe) {
                    bottomText = `${struct.bottom.left || 'VACÍO'} | ${struct.bottom.right || 'VACÍO'}`;
                } else {
                    bottomText = struct.bottom.center || 'VACÍO';
                }

                return `${topText} , ${bottomText}`;
            } else {
                if (struct.single.hasPipe) {
                    return `${struct.single.left || 'VACÍO'} | ${struct.single.right || 'VACÍO'}`;
                } else {
                    return struct.single.center || 'VACÍO';
                }
            }
        }

        // --- BOTONES INTELIGENTES DE SUBDIVISIÓN CON ICONOS DINÁMICOS ---

        function handleTimeAction() {
            if (!activeSelection) return;
            
            let hasPipe = false;
            if (sheetCellStructure.hasComma) {
                if (activeSubcell.startsWith('top')) {
                    hasPipe = sheetCellStructure.top.hasPipe;
                } else {
                    hasPipe = sheetCellStructure.bottom.hasPipe;
                }
            } else {
                hasPipe = sheetCellStructure.single.hasPipe;
            }

            if (hasPipe) {
                // Unir Horizontalmente
                if (sheetCellStructure.hasComma) {
                    if (activeSubcell.startsWith('top')) {
                        sheetCellStructure.top.hasPipe = false;
                        sheetCellStructure.top.center = sheetCellStructure.top.left || 'C';
                        activeSubcell = 'top.center';
                    } else {
                        sheetCellStructure.bottom.hasPipe = false;
                        sheetCellStructure.bottom.center = sheetCellStructure.bottom.left || 'C';
                        activeSubcell = 'bottom.center';
                    }
                } else {
                    sheetCellStructure.single.hasPipe = false;
                    sheetCellStructure.single.center = sheetCellStructure.single.left || 'C';
                    activeSubcell = 'single.center';
                }
            } else {
                // Dividir Horizontalmente
                if (sheetCellStructure.hasComma) {
                    if (activeSubcell === 'top.center' || activeSubcell.startsWith('top')) {
                        sheetCellStructure.top.hasPipe = true;
                        sheetCellStructure.top.left = sheetCellStructure.top.center || 'C';
                        sheetCellStructure.top.right = 'VACÍO';
                        activeSubcell = 'top.right';
                    } else if (activeSubcell === 'bottom.center' || activeSubcell.startsWith('bottom')) {
                        sheetCellStructure.bottom.hasPipe = true;
                        sheetCellStructure.bottom.left = sheetCellStructure.bottom.center || 'C';
                        sheetCellStructure.bottom.right = 'VACÍO';
                        activeSubcell = 'bottom.right';
                    }
                } else {
                    sheetCellStructure.single.hasPipe = true;
                    sheetCellStructure.single.left = sheetCellStructure.single.center || 'C';
                    sheetCellStructure.single.right = 'VACÍO';
                    activeSubcell = 'single.right';
                }
            }

            saveChangesToMainData();
            renderBottomSheetGrid();
            render();
        }

        function handleVueltaAction() {
            if (!activeSelection) return;

            if (sheetCellStructure.hasComma) {
                // Unir Verticalmente
                sheetCellStructure.hasComma = false;
                if (sheetCellStructure.top.hasPipe) {
                    sheetCellStructure.single.hasPipe = true;
                    sheetCellStructure.single.left = sheetCellStructure.top.left;
                    sheetCellStructure.single.right = sheetCellStructure.top.right;
                    activeSubcell = 'single.left';
                } else {
                    sheetCellStructure.single.hasPipe = false;
                    sheetCellStructure.single.center = sheetCellStructure.top.center || 'C';
                    activeSubcell = 'single.center';
                }
            } else {
                // Dividir Verticalmente
                sheetCellStructure.hasComma = true;
                if (sheetCellStructure.single.hasPipe) {
                    sheetCellStructure.top.hasPipe = true;
                    sheetCellStructure.top.left = sheetCellStructure.single.left;
                    sheetCellStructure.top.right = sheetCellStructure.single.right;
                } else {
                    sheetCellStructure.top.hasPipe = false;
                    sheetCellStructure.top.center = sheetCellStructure.single.center || 'C';
                }
                sheetCellStructure.bottom.hasPipe = false;
                sheetCellStructure.bottom.center = 'VACÍO';
                activeSubcell = 'bottom.center';
            }

            saveChangesToMainData();
            renderBottomSheetGrid();
            render();

        // --- TECLADO TÁCTIL INTELIGENTE ---

        function pressKeyboardKey(key) {
            if (!activeSelection || activeSelection.type !== 'chord' || !activeSubcell) return;

            const parts = activeSubcell.split('.');
            const parent = parts[0]; 
            const child = parts[1];  

            let val = sheetCellStructure[parent][child] || '';
            if (val === 'VACÍO') val = '';

            if (key === 'CLEAR') {
                val = '';
            } else if (key === 'BACKSPACE') {
                val = val.length > 0 ? val.substring(0, val.length - 1) : '';
            } else if (['C', 'D', 'E', 'F', 'G', 'A', 'B'].includes(key)) {
                if (val.endsWith('/')) {
                    val = val + key;
                } else {
                    val = key; 
                }
            } else if (key === '#') {
                const lastChar = val.slice(-1);
                if (['C', 'D', 'E', 'F', 'G', 'A', 'B'].includes(lastChar)) {
                    val = val + '#';
                }
            } else if (key === 'b') {
                const lastChar = val.slice(-1);
                if (['C', 'D', 'E', 'F', 'G', 'A', 'B'].includes(lastChar)) {
                    val = val + 'b';
                }
            } else if (key === 'm') {
                if (val && !val.endsWith('/') && !val.endsWith('m')) {
                    val = val + 'm';
                }
            } else if (key === '/') {
                if (val && !val.includes('/') && !val.endsWith('/')) {
                    val = val + '/';
                }
            } else {
                if (val && !val.endsWith('/') && !val.endsWith(key)) {
                    if (!val.includes(key)) {
                        val = val + key;
                    }
                }
            }

            sheetCellStructure[parent][child] = val;
            saveChangesToMainData();
            renderBottomSheetGrid();
            render();
        }

        // --- DIÁLOGO MODAL DE CONFIRMACIÓN PERSONALIZADO CON RESALTADO EN LONA ---

        function showDeleteConfirmation(type, index, blockIdx = null) {
            document.querySelectorAll('.highlight-delete').forEach(el => el.classList.remove('highlight-delete'));

            let title = "";
            let message = "";
            let onConfirmCallback = null;

            if (type === 'column') {
                title = "Eliminar Compás";
                message = `¿Estás seguro de que deseas eliminar este compás completo (columna ${index + 1}) en toda la canción?`;

                document.querySelectorAll(`.chord-cell`).forEach(cell => {
                    const classList = Array.from(cell.classList);
                    const match = classList.find(c => c.startsWith('cell-'));
                    if (match) {
                        const parts = match.split('-');
                        const colIdx = parseInt(parts[3]);
                        if (colIdx === index) {
                            cell.classList.add('highlight-delete');
                        }
                    }
                });

                onConfirmCallback = () => {
                    songData.sections.forEach(sect => {
                        sect.rows.forEach(row => {
                            row.splice(index, 1);
                        });
                    });
                    render();
                    closeSheet();
                };
            } else if (type === 'row') {
                title = "Eliminar Fila de Acordes";
                message = `¿Estás seguro de que deseas eliminar esta fila de acordes de esta sección?`;

                document.querySelectorAll(`.cell-${blockIdx}-${index}-0, .cell-${blockIdx}-${index}-1, .cell-${blockIdx}-${index}-2, .cell-${blockIdx}-${index}-3, .cell-${blockIdx}-${index}-4, .cell-${blockIdx}-${index}-5, .cell-${blockIdx}-${index}-6, .cell-${blockIdx}-${index}-7, .cell-${blockIdx}-${index}-8, .cell-${blockIdx}-${index}-9`).forEach(cell => {
                    cell.classList.add('highlight-delete');
                });
                
                const rowDeleteTr = document.querySelector(`.row-delete-btn-block-${blockIdx}-row-${index}`);
                if (rowDeleteTr) {
                    rowDeleteTr.parentElement.classList.add('highlight-delete');
                }

                onConfirmCallback = () => {
                    songData.sections[blockIdx].rows.splice(index, 1);
                    render();
                    closeSheet();
                };
            } else if (type === 'section') {
                title = "Eliminar Sección Completa";
                message = `¿Estás seguro de que deseas eliminar esta sección completa de la canción?`;

                document.querySelectorAll(`[class*="cell-${blockIdx}-"]`).forEach(cell => {
                    cell.classList.add('highlight-delete');
                });
                const lyricsCell = document.querySelector(`.lyrics-${blockIdx}`);
                if (lyricsCell) lyricsCell.classList.add('highlight-delete');

                onConfirmCallback = () => {
                    songData.sections.splice(blockIdx, 1);
                    render();
                    closeSheet();
                };
            }

            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmModalTitle').textContent = title;
            document.getElementById('confirmModalMessage').textContent = message;

            const cancelBtn = document.getElementById('confirmCancelBtn');
            const confirmBtn = document.getElementById('confirmConfirmBtn');

            const cleanUp = () => {
                modal.style.display = 'none';
                document.querySelectorAll('.highlight-delete').forEach(el => el.classList.remove('highlight-delete'));
            };

            cancelBtn.onclick = (e) => {
                e.stopPropagation();
                cleanUp();
            };

            confirmBtn.onclick = (e) => {
                e.stopPropagation();
                onConfirmCallback();
                cleanUp();
            };

            modal.style.display = 'flex';
        }

        // --- GESTIÓN DE ACCIONES DE ESTRUCTURA GLOBALES ---

        function addNewRowToSection(blockIdx) {
            const numCols = songData.sections[blockIdx].rows[0].length;
            const newRow = Array(numCols).fill('VACÍO');
            songData.sections[blockIdx].rows.push(newRow);
            render();
        }

        function addNewColumnGlobal() {
            songData.sections.forEach(sect => {
                sect.rows.forEach(row => {
                    row.push('VACÍO');
                });
            });
            render();
        }

        function deleteColumnGlobal(colIdx) {
            showDeleteConfirmation('column', colIdx);
        }

        function deleteRowFromSection(blockIdx, rowIdx) {
            showDeleteConfirmation('row', rowIdx, blockIdx);
        }

        function confirmDeleteSectionDirect() {
            let bIdx = null;
            if (activeSelection) {
                bIdx = activeSelection.blockIdx;
            }
            if (bIdx === null) return;
            showDeleteConfirmation('section', null, bIdx);
        }

        // --- ACCIONES GENERALES (Reordenación de Secciones) ---

        function moveSection(blockIdx, direction) {
            const newIdx = blockIdx + direction;
            if (newIdx < 0 || newIdx >= songData.sections.length) return;
            
            const temp = songData.sections[blockIdx];
            songData.sections[blockIdx] = songData.sections[newIdx];
            songData.sections[newIdx] = temp;
            
            reorderingBlockIdx = newIdx;
            render();
        }

        function addNewSection(insertAfterIdx = null) {
            const currentCols = songData.sections.length > 0 ? songData.sections[0].rows[0].length : 4;
            const newRow = Array(currentCols).fill('VACÍO');
            const newSect = {
                lyrics: 'Nueva Sección\n(Escribe la letra aquí)',
                rows: [newRow]
            };
            
            if (insertAfterIdx === -1) {
                // Insertar al inicio absoluto
                songData.sections.unshift(newSect);
            } else if (insertAfterIdx !== null) {
                // Insertar después de la sección indicada
                songData.sections.splice(insertAfterIdx + 1, 0, newSect);
            } else {
                songData.sections.push(newSect);
            }
            render();
        }

        // --- SISTEMA DE ZOOM Y GESTOS TÁCTILES ---
        function applyZoom() {
            // Usar zoom como primera opción para ajustar la maquetación y habilitar scrollbars nativos
            scalableWrapper.style.zoom = currentScale;
            // Para navegadores antiguos o Firefox antiguo que no soporten zoom de maquetación,
            // usamos transform como fallback
            if (!('zoom' in document.documentElement.style)) {
                scalableWrapper.style.transform = `scale(${currentScale})`;
                scalableWrapper.style.transformOrigin = 'top center';
            } else {
                scalableWrapper.style.transform = 'none';
            }
        }

        function resetZoom() {
            const availableWidth = workspace.clientWidth - 20;
            currentScale = availableWidth / 720;
            if (currentScale > 1.0) currentScale = 1.0;
            if (currentScale < 0.4) currentScale = 0.4; // Límite inferior inicial razonable
            applyZoom();
        }

        // Pinch-to-zoom gestual en el área de trabajo
        let touchStartDist = 0;
        let touchStartScale = 1.0;

        workspace.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchStartScale = currentScale;
            }
        }, { passive: false });

        workspace.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && touchStartDist > 0) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                let newScale = touchStartScale * (dist / touchStartDist);
                if (newScale < 0.35) newScale = 0.35;
                if (newScale > 2.0) newScale = 2.0;
                currentScale = newScale;
                applyZoom();
            }
        }, { passive: false });

        workspace.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                touchStartDist = 0;
            }
        });

        // --- EXPORTACIÓN PNG LOCAL ---
        function exportToPng() {
            closeSheet();
            const element = document.getElementById('chartContainer');
            
            const originalTransform = scalableWrapper.style.transform;
            const originalZoom = scalableWrapper.style.zoom;
            
            scalableWrapper.style.transform = 'none';
            scalableWrapper.style.zoom = '1';

            const bgExportColor = document.body.classList.contains('theme-light') ? '#ffffff' : '#000000';

            html2canvas(element, {
                scale: 3, 
                backgroundColor: bgExportColor,
                useCORS: true,
                logging: false
            }).then(canvas => {
                scalableWrapper.style.transform = originalTransform;
                scalableWrapper.style.zoom = originalZoom;

                const link = document.createElement('a');
                const filename = songData.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                link.download = `${filename}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Error en exportación:", err);
                scalableWrapper.style.transform = originalTransform;
                scalableWrapper.style.zoom = originalZoom;
                alert("Ocurrió un error al descargar la imagen.");
            });
        }

        // --- MOTOR DE DIBUJADO DE LA PARTITURA (100% Simétrica y Rígida) ---

        function render() {
            let maxCols = 0;
            songData.sections.forEach(sect => {
                sect.rows.forEach(row => {
                    if (row.length > maxCols) maxCols = row.length;
                });
            });

            if (maxCols < 1) maxCols = 1;

            const deleteColWidth = 44; 
            const addColWidth = 44;    
            const lyricsPercent = 28;
            const chordAreaPercent = 100 - lyricsPercent;
            const singleChordPercent = chordAreaPercent / maxCols;

            let colHtml = `<col style="width: ${deleteColWidth}px">`;
            colHtml += `<col style="width: ${lyricsPercent}%">`;
            for (let i = 0; i < maxCols; i++) {
                colHtml += `<col style="width: ${singleChordPercent}%">`;
            }
            colHtml += `<col style="width: ${addColWidth}px">`; 
            tableColGroup.innerHTML = colHtml;

            let html = '';

            // FILA DE CABECERA (título + tonalidad) alineada con columnas de contenido
            const headerTitleColspan = maxCols; // lyrics col + (maxCols-1) chord cols
            html += `<tr class="header-row" onclick="event.stopPropagation()">`;
            html += `<td class="td-transparent"></td>`;
            html += `<td class="header-title-td" id="headerTitleBox" colspan="${headerTitleColspan}" title="Editar Título">
                        <div class="header-title" id="outTitle">${songData.title}</div>
                     </td>`;
            html += `<td class="header-key-td" id="keyWrapper" title="Editar Tono">
                        <div class="key-text" id="outKey">${songData.key}</div>
                     </td>`;
            html += `<td class="td-transparent"></td>`;
            html += `</tr>`;

            // Fila de control superior para Eliminar Columnas (Arriba)
            html += `<tr class="col-control-tr" onclick="event.stopPropagation()">`;
            html += `<td class="td-transparent"></td>`; 
            
            // BOTÓN ＋ SECCIÓN AL INICIO ABSOLUTO
            html += `<td class="add-section-cell add-section-first" title="Añadir Nueva Sección al principio">
                        <div class="add-section-inner">＋ Sección</div>
                     </td>`;
                     
            for (let i = 0; i < maxCols; i++) {
                html += `<td class="col-delete-cell" data-col-idx="${i}" title="Eliminar Compás (Columna ${i + 1})">
                            <div class="col-delete-inner">✕</div>
                         </td>`;
            }
            html += `<td class="td-transparent"></td>`; 
            html += `</tr>`;

            songData.sections.forEach((sect, blockIdx) => {
                if (sect.rows.length === 0) return;
                
                let sectionClass = 'sect-general';
                const lowerType = sect.lyrics.toLowerCase();
                if (lowerType.includes('estrofa')) sectionClass = 'sect-estrofa';
                else if (lowerType.includes('coro')) sectionClass = 'sect-coro';
                else if (lowerType.includes('puente')) sectionClass = 'sect-puente';
                else if (lowerType.includes('pre-coro') || lowerType.includes('precoro')) sectionClass = 'sect-pre-coro';
                else if (lowerType.includes('intro')) sectionClass = 'sect-intro';
                else if (lowerType.includes('outro')) sectionClass = 'sect-outro';
                else if (lowerType.includes('solo')) sectionClass = 'sect-solo';

                // Color de fondo cíclico por sección (6 colores)
                const sectionBgClass = `sect-bg-${blockIdx % 6}`;

                const rowSpan = sect.rows.length;

                sect.rows.forEach((rowArr, rowIdx) => {
                    html += `<tr>`;
                    
                    // 1. ELIMINAR FILA (✕ ROJO DASHED CUADRADO DEL ALTO DE LA CELDA)
                    html += `<td class="row-delete-cell" data-block-idx="${blockIdx}" data-row-idx="${rowIdx}" title="Eliminar Fila de Acordes">
                                <div class="row-delete-inner">✕</div>
                             </td>`;

                    // 2. LETRA (con rowspan y modo de reordenación por Long-Press)
                    if (rowIdx === 0) {
                        const lyricsDisplay = sect.lyrics.trim() ? sect.lyrics : 'Escribe la letra aquí...';
                        const isEmptyClass = !sect.lyrics.trim() ? 'empty' : '';
                        
                        if (reorderingBlockIdx === blockIdx) {
                            html += `
                                <td class="lyrics-cell ${sectionClass} ${sectionBgClass} lyrics-${blockIdx} reordering" rowspan="${rowSpan}" data-block-idx="${blockIdx}">
                                    <div class="lyrics-reorder-container">
                                        <div class="reorder-btn btn-up" data-block-idx="${blockIdx}" title="Mover Sección Arriba">▲ Subir</div>
                                        <div class="reorder-lyrics-preview">${lyricsDisplay}</div>
                                        <div class="reorder-btn btn-down" data-block-idx="${blockIdx}" title="Mover Sección Abajo">▼ Bajar</div>
                                    </div>
                                </td>
                            `;
                        } else {
                            html += `<td class="lyrics-cell ${sectionClass} ${sectionBgClass} lyrics-${blockIdx}" rowspan="${rowSpan}" data-block-idx="${blockIdx}">
                                        <div class="lyrics-inner ${isEmptyClass}">${lyricsDisplay}</div>
                                     </td>`;
                        }
                    }

                    // 3. COMPASES DE ACORDES — tamaño de fuente fijo por nivel de subdivisión
                    rowArr.forEach((cell, colIdx) => {
                        cell = cell.trim().replace(/\s*-\s*/g, ' | '); 
                        const isSelected = activeSelection && activeSelection.type === 'chord' && activeSelection.blockIdx === blockIdx && activeSelection.rowIdx === rowIdx && activeSelection.colIdx === colIdx ? 'selected' : '';
                        
                        if (cell === 'VACÍO' || !cell) {
                            const colDarkClass = colIdx % 2 === 1 ? 'col-dark' : '';
                            html += `<td class="chord-cell cell-${blockIdx}-${rowIdx}-${colIdx} ${isSelected} ${sectionClass} ${sectionBgClass} ${colDarkClass}" data-block-idx="${blockIdx}" data-row-idx="${rowIdx}" data-col-idx="${colIdx}">
                                        <div class="chord-inner" style="color: rgba(255,255,255,0.1); font-size: 11px;">+</div>
                                     </td>`;
                        } else {
                            // Nivel de subdivisión de la celda → tamaño de fuente fijo
                            const level = getCellLevel(cell);
                            const fontSize = getCellFontSize(level);

                            const renderHorizontal = (text) => {
                                if (text.includes('|')) {
                                    const parts = text.split('|');
                                    const leftText = parts[0].trim();
                                    const rightText = parts[1] ? parts[1].trim() : '';

                                    return `
                                        <div class="split-horizontal-box">
                                            <div class="split-left">${leftText}</div>
                                            <div class="split-right">${rightText}</div>
                                        </div>
                                    `;
                                } else {
                                    return `<div class="chord-inner">${text}</div>`;
                                }
                            };

                            let cellHTML = '';
                            
                            if (cell.includes(',')) {
                                const parts = cell.split(',');
                                const topText = parts[0].trim();
                                const bottomText = parts[1] ? parts[1].trim() : '';

                                const topHTML = renderHorizontal(topText);
                                const bottomHTML = renderHorizontal(bottomText);

                                cellHTML = `
                                    <div class="split-box">
                                        <div class="split-top">${topHTML}</div>
                                        <div class="split-bottom">${bottomHTML}</div>
                                    </div>
                                `;
                            } else {
                                cellHTML = renderHorizontal(cell);
                            }

                            const colDarkClass = colIdx % 2 === 1 ? 'col-dark' : '';
                            html += `<td class="chord-cell cell-${blockIdx}-${rowIdx}-${colIdx} ${isSelected} ${sectionClass} ${sectionBgClass} ${colDarkClass}" data-block-idx="${blockIdx}" data-row-idx="${rowIdx}" data-col-idx="${colIdx}" style="font-size: ${fontSize};">
                                        ${cellHTML}
                                     </td>`;
                        }
                    });

                    const missing = maxCols - rowArr.length;
                    for (let i = 0; i < missing; i++) {
                        const padColIdx = maxCols - missing + i;
                        const colDarkClass = padColIdx % 2 === 1 ? 'col-dark' : '';
                        html += `<td class="chord-cell cell-${blockIdx}-${rowIdx}-${padColIdx} ${sectionClass} ${sectionBgClass} ${colDarkClass}">&nbsp;</td>`;
                    }

                    // 4. AGREGAR COMPÁS (＋ ZINZ/AZUL DASHED CUADRADO CON ROWSPAN)
                    if (rowIdx === 0) {
                        html += `<td class="add-col-cell" rowspan="${rowSpan}" title="Añadir Compás (Columna)">
                                    <div class="add-col-inner">＋</div>
                                 </td>`;
                    }

                    html += `</tr>`;
                });

                // FILA DE CONTROL DE ESTRUCTURA LOCAL DE SECCIÓN (Abajo)
                html += `
                    <tr class="add-row-tr" onclick="event.stopPropagation()">
                        <td class="td-transparent"></td>
                        <td class="add-section-cell" data-block-idx="${blockIdx}" title="Añadir Nueva Sección debajo">
                            <div class="add-section-inner">＋ Sección</div>
                        </td>
                        <td class="add-row-cell" data-block-idx="${blockIdx}" colspan="${maxCols}" title="Añadir Fila de Acordes">
                            <div class="add-row-inner">＋ Fila de Acordes</div>
                        </td>
                        <td class="td-transparent"></td>
                    </tr>
                `;
            });

            chartBody.innerHTML = html;

            // --- VINCULACIÓN DINÁMICA DE EVENTOS ---
            
            // 1. Celdas de eliminar columna (Arriba)
            document.querySelectorAll('.col-delete-cell').forEach(cell => {
                const idx = parseInt(cell.getAttribute('data-col-idx'));
                cell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteColumnGlobal(idx);
                });
            });

            // 2. Celdas de letras: Click e interactividad de Reordenación (Long Press)
            document.querySelectorAll('.lyrics-cell').forEach(cell => {
                const bIdx = parseInt(cell.getAttribute('data-block-idx'));
                
                if (cell.classList.contains('reordering')) return;

                // Captura de Long Press (Pulsación Larga)
                const startLongPressTimer = () => {
                    isLongPressActive = false;
                    longPressTimer = setTimeout(() => {
                        isLongPressActive = true;
                        reorderingBlockIdx = bIdx;
                        render();
                    }, 550); 
                };

                const clearLongPressTimer = () => {
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                };

                cell.addEventListener('mousedown', startLongPressTimer);
                cell.addEventListener('touchstart', startLongPressTimer);
                
                cell.addEventListener('mouseup', clearLongPressTimer);
                cell.addEventListener('touchend', clearLongPressTimer);
                cell.addEventListener('mousemove', clearLongPressTimer);
                cell.addEventListener('touchmove', clearLongPressTimer);

                cell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isLongPressActive) {
                        isLongPressActive = false;
                        return; 
                    }
                    
                    if (reorderingBlockIdx !== null) {
                        reorderingBlockIdx = null;
                        render();
                        return;
                    }
                    
                    openTextEdit('lyrics', bIdx);
                });
            });

            // 3. Botones de reordenación de sección (Up/Down)
            document.querySelectorAll('.reorder-btn.btn-up').forEach(btn => {
                const bIdx = parseInt(btn.getAttribute('data-block-idx'));
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    moveSection(bIdx, -1);
                });
            });

            document.querySelectorAll('.reorder-btn.btn-down').forEach(btn => {
                const bIdx = parseInt(btn.getAttribute('data-block-idx'));
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    moveSection(bIdx, 1);
                });
            });

            // 4. Celdas de acordes
            document.querySelectorAll('.chord-cell').forEach(cell => {
                const bIdx = cell.getAttribute('data-block-idx');
                const rIdx = cell.getAttribute('data-row-idx');
                const cIdx = cell.getAttribute('data-col-idx');
                if (bIdx !== null && rIdx !== null && cIdx !== null) {
                    cell.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (reorderingBlockIdx !== null) {
                            reorderingBlockIdx = null;
                            render();
                            return;
                        }
                        openChordEdit(parseInt(bIdx), parseInt(rIdx), parseInt(cIdx));
                    });
                }
            });

            // 5. Botones de eliminar fila (Izquierda)
            document.querySelectorAll('.row-delete-cell').forEach(cell => {
                const bIdx = cell.getAttribute('data-block-idx');
                const rIdx = cell.getAttribute('data-row-idx');
                if (bIdx !== null && rIdx !== null) {
                    cell.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteRowFromSection(parseInt(bIdx), parseInt(rIdx));
                    });
                }
            });

            // 6. Botón agregar compás (Columna - Derecha)
            document.querySelectorAll('.add-col-cell').forEach(cell => {
                cell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addNewColumnGlobal();
                });
            });

            // 7. Botón agregar fila (Abajo)
            document.querySelectorAll('.add-row-cell').forEach(cell => {
                const bIdx = parseInt(cell.getAttribute('data-block-idx'));
                cell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addNewRowToSection(bIdx);
                });
            });

            // 8. Botones agregar sección (Abajo e Inicial)
            document.querySelectorAll('.add-section-cell').forEach(cell => {
                cell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const bIdx = cell.getAttribute('data-block-idx');
                    if (bIdx !== null) {
                        addNewSection(parseInt(bIdx));
                    } else if (cell.classList.contains('add-section-first')) {
                        addNewSection(-1);
                    }
                });
            });

            // 9. Cabecera: título y tonalidad (generados dinámicamente)
            const headerTitleBox = document.getElementById('headerTitleBox');
            if (headerTitleBox) {
                headerTitleBox.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openTextEdit('title');
                });
            }

            const keyWrapperEl = document.getElementById('keyWrapper');
            if (keyWrapperEl) {
                keyWrapperEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openKeySelector();
                });
            }

            // Resetear escala y zoom de visualización
            setTimeout(applyZoom, 0);
        }

        // Inicializar
        window.addEventListener('load', () => {
            resetZoom();
            render();
        });

        window.addEventListener('resize', () => {
            if (!bottomSheet.classList.contains('open')) {
                resetZoom();
            }
        });
    </script>
</body>
</html>
